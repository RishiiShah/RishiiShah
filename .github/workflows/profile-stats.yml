name: Refresh profile charts

on:
  schedule:
    - cron: '35 10 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_stats.py
      - scripts/test_profile_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check chart calculations
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh public data and charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_stats.py
      - name: Save refreshed charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile charts'
            git push
          fi
